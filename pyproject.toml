[project]
name = "agenticcoding"
version = "0.1.0"
description = "Multichannel engagement report generator for pharma field-force data"
readme = "README.md"
authors = [
    { name = "martinilovessience", email = "martin.kurek@icloud.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agenticcoding = "agenticcoding:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
